kind = "web"
previewPath = "/"
title = "Web3 Job Marketplace"
version = "1.0.0"
id = "artifacts/web3-marketplace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24913

[services.development]
run = "pnpm --filter @workspace/web3-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web3-marketplace", "run", "build" ]
publicDir = "artifacts/web3-marketplace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24913"
BASE_PATH = "/"
